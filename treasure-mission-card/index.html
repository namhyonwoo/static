<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>유년부 보물찾기 미션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 왼쪽 반 고르기 보드(보석 3칸 = 도전 횟수) + 오른쪽 큰 미션 카드. 좁은 화면에서는 위아래로 쌓임 */
:root {
  --sky: #E4F3FF;
  --paper: #FFFFFF;
  --ink: #22305A;
  --ink-soft: #5A6890;
  --line: #C9DDF0;
  --sun: #FFC23D;
  --sun-ink: #4A3200;
  --grass: #2FA86E;
  --sea: #3A82E4;
  --berry: #EB5A84;
  --shadow: #B7D3EC;
  --face-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --face-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sky: #111D35;
    --paper: #1B2B4C;
    --ink: #EAF2FF;
    --ink-soft: #A9B8D8;
    --line: #2E4370;
    --shadow: #0A1426;
    --sea: #6AA6FF;
    --grass: #4CCB8C;
    --berry: #FF7FA3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sky: #111D35;
  --paper: #1B2B4C;
  --ink: #EAF2FF;
  --ink-soft: #A9B8D8;
  --line: #2E4370;
  --shadow: #0A1426;
  --sea: #6AA6FF;
  --grass: #4CCB8C;
  --berry: #FF7FA3;
}

html, body { min-height: 100%; }
body {
  background: var(--sky);
  background-image: radial-gradient(var(--line) 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--face-body);
  font-size: 17px;
  line-height: 1.6;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { flex: none; }
h1 {
  font-family: var(--face-display);
  font-weight: 400;
  font-size: clamp(30px, 5vw, 44px);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 .x { color: var(--berry); }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }

.mode {
  display: inline-flex;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  gap: 4px;
}
.mode button {
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 6px 14px;
  font-family: var(--face-display);
  font-size: 16px;
  color: var(--ink-soft);
}
.mode button[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }

.panel {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 6px 0 var(--shadow);
  padding: 18px;
}
.panel h2 {
  font-family: var(--face-display);
  font-weight: 400;
  font-size: 20px;
  margin: 0 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.panel h2 small { font-family: var(--face-body); font-size: 13px; color: var(--ink-soft); }

.grades { display: flex; flex-direction: column; gap: 12px; }
.grade { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
.grade-label {
  font-family: var(--face-display);
  font-size: 16px;
  color: var(--ink-soft);
  padding-top: 14px;
}
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }

.cls {
  border: 2px solid var(--line);
  background: var(--paper);
  border-radius: 16px;
  padding: 8px 6px 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: transform .12s, border-color .12s, background .12s;
}
.cls:hover { transform: translateY(-2px); border-color: var(--sea); }
.cls .name { font-family: var(--face-display); font-size: 22px; line-height: 1; }
.cls .gems { display: flex; gap: 4px; }
.gem { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
.gem.on { background: var(--sun); border-color: var(--sun); }
.cls[aria-pressed="true"] { border-color: var(--ink); background: var(--sky); box-shadow: 0 3px 0 var(--ink); }
.cls.done .name { color: var(--ink-soft); }
.cls.done .gems::after { content: "완료"; font-size: 11px; color: var(--grass); margin-left: 2px; line-height: 12px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 2px dashed var(--line); }
.ghost {
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 14px;
  color: var(--ink-soft);
}
.ghost:hover { border-color: var(--ink-soft); color: var(--ink); }
.ghost:disabled { opacity: .45; cursor: not-allowed; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; font-size: 14px; }
.confirm .danger { border-color: var(--berry); color: var(--berry); }

/* mission card */
.stage { display: flex; flex-direction: column; gap: 14px; }
.stage-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.who { font-family: var(--face-display); font-size: 26px; line-height: 1.2; }
.who span { color: var(--ink-soft); font-size: 18px; }
.draw {
  border: 0;
  background: var(--berry);
  color: #fff;
  font-family: var(--face-display);
  font-size: 22px;
  padding: 12px 26px;
  border-radius: 999px;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--berry) 60%, #000);
  transition: transform .1s, box-shadow .1s;
}
.draw:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--berry) 60%, #000); }
.draw:disabled { background: var(--line); color: var(--ink-soft); box-shadow: none; cursor: not-allowed; }

.card {
  --cat: var(--sea);
  position: relative;
  background: var(--paper);
  border: 3px solid var(--cat);
  border-radius: 26px;
  box-shadow: 0 8px 0 var(--cat);
  padding: 26px clamp(18px, 4vw, 36px) 28px;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card.pop { animation: pop .45s cubic-bezier(.3,1.5,.6,1); }
@keyframes pop { from { transform: scale(.94) rotate(-1deg); } to { transform: none; } }
.card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.num {
  font-family: var(--face-display);
  font-size: 15px;
  background: var(--cat);
  color: #fff;
  border-radius: 999px;
  padding: 3px 12px;
  font-variant-numeric: tabular-nums;
}
.cat { font-family: var(--face-display); font-size: 15px; color: var(--cat); letter-spacing: .04em; }
.round { margin-left: auto; font-size: 14px; color: var(--ink-soft); }
.card h3 {
  font-family: var(--face-display);
  font-weight: 400;
  font-size: clamp(30px, 4.4vw, 46px);
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
.desc { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.6; margin: 0; max-width: 34em; }
.big {
  font-family: var(--face-display);
  font-size: clamp(56px, 10vw, 96px);
  line-height: 1;
  letter-spacing: .1em;
  color: var(--cat);
}
.prep { font-size: 14px; color: var(--ink-soft); margin: 0; }
.prep b { color: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; }
.btn {
  border: 2px solid var(--ink);
  background: var(--paper);
  border-radius: 999px;
  padding: 8px 18px;
  font-family: var(--face-display);
  font-size: 18px;
}
.btn.answer { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.btn.timer { font-variant-numeric: tabular-nums; min-width: 9.5em; }
.btn.timer.run { background: var(--ink); color: var(--paper); }
.btn.timer.end { background: var(--berry); border-color: var(--berry); color: #fff; }

.answer-box {
  border: 2px dashed var(--cat);
  border-radius: 18px;
  padding: 14px 18px;
  background: color-mix(in srgb, var(--cat) 10%, var(--paper));
}
.answer-box .lbl { font-family: var(--face-display); font-size: 15px; color: var(--cat); letter-spacing: .04em; }
.answer-box p { margin: 2px 0 0; font-size: clamp(19px, 2.2vw, 24px); }

.empty { align-items: center; justify-content: center; text-align: center; color: var(--ink-soft); --cat: var(--line); }
.empty h3 { color: var(--ink); }
.history { font-size: 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--paper); font-variant-numeric: tabular-nums; }

.btn.pass { margin-left: auto; border-style: dashed; border-color: var(--ink-soft); color: var(--ink-soft); }
.btn.pass:hover { border-style: solid; color: var(--ink); border-color: var(--ink); }
.chip b { font-weight: 400; font-family: var(--face-display); margin-right: 4px; }
.chip.ok { border-color: var(--grass); }
.chip.ok b { color: var(--grass); }
.chip.fail b { color: var(--berry); }
.chip.pass, .chip.giveup { opacity: .7; }
.btn.giveup { border-color: var(--line); color: var(--ink-soft); }
.btn.giveup:hover { border-color: var(--berry); color: var(--berry); }
.chip.pass span { text-decoration: line-through; }

.judge {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding-top: 14px; border-top: 2px dashed var(--line);
}
.judge-hint { margin: 0; padding-top: 14px; border-top: 2px dashed var(--line); font-size: 14px; color: var(--ink-soft); }
.judge-label { font-family: var(--face-display); font-size: 16px; color: var(--ink-soft); margin-right: 4px; }
.btn.ok { background: var(--grass); border-color: var(--grass); color: #fff; font-size: 20px; padding: 10px 24px; }
.btn.fail { border-color: var(--berry); color: var(--berry); font-size: 20px; padding: 10px 24px; }

.result { align-items: center; justify-content: center; text-align: center; }
.result.ok { --cat: var(--grass); }
.result.fail { --cat: var(--berry); }
.result.done { --cat: var(--sun); }
.result .stamp {
  font-family: var(--face-display);
  font-size: clamp(44px, 8vw, 72px);
  line-height: 1;
  color: var(--cat);
}
.result .what { font-size: 15px; color: var(--ink-soft); margin: 0; }

.admin { width: 100%; font-size: 14px; }
.admin summary { cursor: pointer; color: var(--ink-soft); width: max-content; }
.admin summary:hover { color: var(--ink); }
.admin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 34px; height: 32px; font-size: 18px; line-height: 1; }
.stepper button:hover:not(:disabled) { background: var(--sky); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 3em; text-align: center; font-family: var(--face-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.admin-note { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; }

.c-bible { --cat: #E39A00; }
.c-eye { --cat: var(--sea); }
.c-team { --cat: var(--grass); }
.c-think { --cat: var(--berry); }

.shuffle h3, .shuffle .desc { opacity: .35; }

@media (prefers-reduced-motion: reduce) {
  .card.pop { animation: none; }
  .cls { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg width="58" height="58" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="26" width="52" height="30" rx="6" fill="#C9762E"/>
        <path d="M6 32 Q6 12 32 12 Q58 12 58 32 Z" fill="#E08A3A"/>
        <rect x="6" y="28" width="52" height="7" fill="#FFC23D"/>
        <rect x="27" y="26" width="10" height="14" rx="3" fill="#FFC23D" stroke="#4A3200" stroke-width="2"/>
        <circle cx="32" cy="33" r="2" fill="#4A3200"/>
        <path d="M14 12 l3 -6 l3 6 l-3 -2 z" fill="#3A82E4"/>
        <circle cx="50" cy="8" r="3" fill="#EB5A84"/>
      </svg>
      <div>
        <h1>보물찾기 <span class="x">미션</span></h1>
        <p class="sub">유년부 1~3학년 · 반마다 성공 <span id="rule">3</span>번까지 · 맞힌 미션만 보물 카드 1장</p>
      </div>
    </div>
  </header>

  <div class="main">
    <section class="panel" aria-labelledby="pick-title">
      <h2 id="pick-title">반 고르기 <small>● = 성공한 미션</small></h2>
      <div class="grades" id="grades"></div>
      <div class="tools" id="tools"></div>
    </section>

    <section class="stage" aria-live="polite">
      <div class="stage-head">
        <div class="who" id="who"></div>
        <button type="button" class="draw" id="draw">미션 뽑기</button>
      </div>
      <div id="card-slot"></div>
      <div class="history" id="history"></div>
    </section>
  </div>
</div>

<script>
const CLASSES = { "1학년": ["1-1", "1-2"], "2학년": ["2-1", "2-2", "2-3"], "3학년": ["3-1", "3-2", "3-3", "3-4"] };
const CATS = {
  bible: { name: "성경 지식", cls: "c-bible" },
  eye:   { name: "관찰력 · 기억력", cls: "c-eye" },
  team:  { name: "협동 · 순발력", cls: "c-team" },
  think: { name: "도전 · 추리", cls: "c-think" }
};

const MISSIONS = [
  { n: 1, cat: "bible", title: "성경 인물 3명 말하기", desc: "15초 안에 성경에 나오는 인물 3명을 말해요.", time: 15,
    answer: "예시: 노아, 모세, 다윗 (성경에 나오는 인물이면 모두 정답)" },
  { n: 2, cat: "bible", title: "성경 이야기 순서 맞추기", desc: "아래 일을 일어난 순서대로 말해요.<br>· 홍수가 났어요<br>· 방주에서 나왔어요<br>· 노아가 방주를 만들었어요",
    answer: "노아가 방주를 만들었어요 → 홍수가 났어요 → 방주에서 나왔어요" },
  { n: 3, cat: "bible", title: "인물과 사건 연결하기", desc: "다윗, 모세, 노아를 골리앗, 홍해, 방주와 알맞게 연결해요.",
    answer: "다윗 – 골리앗 · 모세 – 홍해 · 노아 – 방주" },
  { n: 4, cat: "bible", title: "성경 속 동물 4종 말하기", desc: "20초 안에 성경 이야기에 나오는 동물 네 가지를 말해요.", time: 20,
    answer: "예시: 비둘기, 사자, 양, 나귀, 뱀, 큰 물고기, 까마귀, 낙타" },
  { n: 5, cat: "bible", title: "예수님의 제자 이야기", desc: "예수님의 제자 이름을 두 명 이상 말해요.",
    answer: "베드로, 안드레, 야고보, 요한, 빌립, 바돌로매, 도마, 마태, 다대오, 시몬, 가룟 유다 등" },
  { n: 6, cat: "bible", title: "성경 인물 초성 퀴즈", desc: "이 초성은 어떤 성경 인물일까요?", big: "ㄷㅇ",
    answer: "다윗" },
  { n: 7, cat: "bible", title: "천지창조 퀴즈", desc: "① 하나님은 며칠 동안 세상을 만드셨을까요?<br>② 일곱째 날에는 무엇을 하셨을까요?",
    answer: "① 엿새(6일) ② 쉬셨어요 (창세기 2:2)" },
  { n: 8, cat: "bible", title: "아기 모세 퀴즈", desc: "아기 모세는 무엇에 담겨 강물에 띄워졌을까요?",
    answer: "갈대 상자 (바구니라고 해도 정답, 출애굽기 2:3)" },
  { n: 9, cat: "bible", title: "아기 예수님 퀴즈", desc: "① 예수님은 어느 마을에서 태어나셨을까요?<br>② 아기 예수님을 어디에 누였을까요?",
    answer: "① 베들레헴 ② 구유(말구유) (누가복음 2:7)" },
  { n: 10, cat: "eye", title: "공통점 찾기", desc: "사과, 바나나, 포도의 같은 점은 무엇일까요?",
    answer: "모두 과일이에요" },
  { n: 11, cat: "eye", title: "반대말 맞히기", desc: "크다, 길다, 밝다의 반대말을 모두 말해요.",
    answer: "작다, 짧다, 어둡다" },
  { n: 12, cat: "eye", title: "'사랑'으로 시작하기", desc: "'사랑'으로 시작하는 성경 말씀이나 찬양 제목을 하나 말해요.",
    answer: "예시: \"사랑은 오래 참고\" (고린도전서 13:4), \"사랑하는 자들아 우리가 서로 사랑하자\" (요한일서 4:7)" },
  { n: 13, cat: "bible", title: "다니엘 퀴즈", desc: "두 문제 모두 맞혀요.<br>① 다니엘이 들어간 굴에는 어떤 동물이 있었을까요?<br>② 다니엘은 하루에 몇 번 기도했을까요?",
    answer: "① 사자 ② 세 번 (다니엘 6:10). 두 문제 모두 맞히면 성공" },
  { n: 14, cat: "think", title: "하나님의 약속 수수께끼", desc: "\"나는 비가 그친 뒤 하늘에 떠요. 하나님이 노아에게 약속의 표시로 보여 주셨어요. 나는 무엇일까요?\"",
    answer: "무지개 (창세기 9:13)" },
  { n: 15, cat: "bible", title: "오병이어 퀴즈", desc: "예수님이 많은 사람을 먹이실 때, 한 아이가 드린 떡과 물고기는 각각 몇 개였을까요?",
    answer: "떡 다섯 개, 물고기 두 마리 (요한복음 6:9). 둘 다 맞히면 성공" },
  { n: 16, cat: "team", title: "금지어 없이 설명하기", desc: "반 대표가 '방주'라는 말을 쓰지 않고 노아의 방주를 설명해요. 친구들이 맞혀요.",

    answer: "②번이 틀렸어요. 모세가 아니라 다윗이 골리앗과 싸웠어요" },

    answer: "예시: 기도하기, 찬양하기, 감사 표현하기, 이웃 돕기, 예배드리기" },

    answer: "아브라함 → 이삭 → 야곱 (할아버지 → 아버지 → 아들)" },

    answer: "사과 (사과만 과일이에요)" },

    answer: "감사 (범사에 감사하라, 데살로니가전서 5:16-18)" },
  { n: 26, cat: "think", title: "참·거짓 판단하기", desc: "선생님이 읽는 문장이 맞으면 O, 틀리면 X로 표시해요.<br>\"다윗은 물맷돌로 골리앗과 싸웠다.\"",
    answer: "O (맞아요)" },
  { n: 27, cat: "think", title: "세 가지 단서로 인물 찾기", desc: "선생님이 단서를 하나씩 말해요. 누구일까요?<br>① 작은 소년이었어요.<br>② 물맷돌을 사용했어요.<br>③ 골리앗과 싸웠어요.",
    answer: "다윗" },
  { n: 28, cat: "bible", title: "삭개오 퀴즈", desc: "키가 작아서 예수님을 보려고 나무에 올라간 사람은 누구일까요?",
    answer: "삭개오 (누가복음 19:4)" },
  { n: 29, cat: "eye", title: "반대말 맞히기 2", desc: "높다, 빠르다, 많다의 반대말을 모두 말해요.",
    answer: "낮다, 느리다, 적다" },
  { n: 30, cat: "think", title: "광야 수수께끼", desc: "\"나는 하늘에서 내려온 하얀 음식이에요. 광야에서 이스라엘 백성이 아침마다 나를 거두어 먹었어요. 나는 무엇일까요?\"<br>보기: 만나 · 떡볶이 · 사탕",
    answer: "만나 (출애굽기 16:15)" }
];
const byNum = Object.fromEntries(MISSIONS.map(m => [m.n, m]));

// 반마다 log: [{ n, r }] (r = "ok" 성공 · "fail" 실패 · "pass"), cur: 지금 도전 중인 미션 번호
// 성공(ok)만 최대 도전 횟수에 셈. 실패와 PASS는 세지 않음
const KEY = "yunyeonbu-treasure-v2";
const MAX_LIMIT = 10;
let state = { log: {}, cur: {}, sel: "1-1", max: 3 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.log) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let showAnswer = false, confirming = false, timer = null, timeLeft = 0, animating = false, adminOpen = false;
const $ = id => document.getElementById(id);
const logOf = c => state.log[c] || [];
const curOf = c => state.cur[c] ?? null;
const winsOf = c => logOf(c).filter(e => e.r === "ok").length;
const pad = n => String(n).padStart(2, "0");
// giveup(포기): 세지 않고 그 반의 처음 화면으로 돌아감
const RESULT = { ok: "성공", fail: "실패", pass: "PASS", giveup: "포기" };

function renderBoard() {
  const g = $("grades");
  g.innerHTML = "";
  for (const [grade, list] of Object.entries(CLASSES)) {
    const row = document.createElement("div");
    row.className = "grade";
    row.innerHTML = `<div class="grade-label">${grade}</div><div class="classes"></div>`;
    const box = row.querySelector(".classes");
    for (const c of list) {
      const w = winsOf(c);
      const b = document.createElement("button");
      b.type = "button";
      b.id = "cls-" + c;
      b.className = "cls" + (w >= state.max ? " done" : "");
      b.setAttribute("aria-pressed", String(state.sel === c));
      b.setAttribute("aria-label", `${c}반, ${state.max}번 중 ${w}번 성공`);
      b.innerHTML = `<span class="name">${c}</span><span class="gems">${
        Array.from({ length: Math.max(state.max, w) }, (_, i) => `<span class="gem${i < w ? " on" : ""}"></span>`).join("")}</span>`;
      b.onclick = () => { state.sel = c; showAnswer = false; stopTimer(); save(); render(); };
      box.appendChild(b);
    }
    g.appendChild(row);
  }

  const t = $("tools");
  const c = state.sel, cur = curOf(c), log = logOf(c);
  const last = log[log.length - 1];
  if (confirming) {
    t.innerHTML = `<div class="confirm">모든 반의 도전 기록을 지울까요?
      <button type="button" class="ghost danger" id="reset-yes">네, 모두 지우기</button>
      <button type="button" class="ghost" id="reset-no">취소</button></div>`;
    $("reset-yes").onclick = () => { state.log = {}; state.cur = {}; confirming = false; showAnswer = false; stopTimer(); save(); render(); };
    $("reset-no").onclick = () => { confirming = false; render(); };
  } else {
    const undoLabel = cur != null ? `${c}반 뽑은 미션 취소`
      : last && last.r !== "pass" ? `${c}반 마지막 판정(${RESULT[last.r]}) 취소` : `${c}반 마지막 기록 취소`;
    t.innerHTML = `<button type="button" class="ghost" id="undo" ${cur != null || log.length ? "" : "disabled"}>${undoLabel}</button>
      <button type="button" class="ghost" id="reset">전체 초기화</button>`;
    $("undo").onclick = undo;
    $("reset").onclick = () => { confirming = true; render(); };
  }

  const admin = document.createElement("details");
  admin.className = "admin";
  admin.open = adminOpen;
  admin.innerHTML = `<summary>관리자 설정</summary>
    <div class="admin-row">
      <span>반마다 최대 성공</span>
      <div class="stepper">
        <button type="button" id="max-down" aria-label="최대 성공 1번 줄이기" ${state.max <= 1 ? "disabled" : ""}>−</button>
        <output id="max-val">${state.max}번</output>
        <button type="button" id="max-up" aria-label="최대 성공 1번 늘리기" ${state.max >= MAX_LIMIT ? "disabled" : ""}>+</button>
      </div>
    </div>
    <p class="admin-note">모든 반에 똑같이 적용돼요. 성공한 미션만 세고, 실패와 PASS는 세지 않아요.</p>`;
  admin.addEventListener("toggle", () => { adminOpen = admin.open; });
  t.appendChild(admin);
  $("max-down").onclick = () => setMax(state.max - 1);
  $("max-up").onclick = () => setMax(state.max + 1);
}

function setMax(n) {
  state.max = Math.min(MAX_LIMIT, Math.max(1, n));
  save(); render();
}

// 뒤로 한 칸: 뽑은 미션이 있으면 뽑기를 취소, 없으면 마지막 판정을 되돌려 다시 판정하게 함
function undo() {
  const c = state.sel, log = logOf(c);
  if (curOf(c) != null) state.cur[c] = null;
  else if (log.length) {
    const last = log[log.length - 1];
    state.log[c] = log.slice(0, -1);
    if (last.r !== "pass") state.cur[c] = last.n;
  }
  showAnswer = false; stopTimer(); save(); render();
}

function pool(exclude = []) {
  const base = MISSIONS.map(m => m.n);
  const seen = [...logOf(state.sel).map(e => e.n), ...exclude];
  const left = base.filter(n => !seen.includes(n));
  if (left.length) return left;
  const notNow = base.filter(n => !exclude.includes(n));
  return notNow.length ? notNow : base;
}

function cardHTML(m, shuffle) {
  const cat = CATS[m.cat];
  const w = winsOf(state.sel);
  return `<article class="card ${cat.cls}${shuffle ? " shuffle" : ""}">
    <div class="card-top">
      <span class="num">미션 ${pad(m.n)}</span>
      <span class="cat">${cat.name}</span>
      ${shuffle ? "" : `<span class="round">보물 ${w + 1}번째 도전</span>`}
    </div>
    <h3>${m.title}</h3>
    ${m.big ? `<div class="big">${m.big}</div>` : ""}
    <p class="desc">${m.desc}</p>
    ${m.prep ? `<p class="prep"><b>준비물</b> ${m.prep}</p>` : ""}
    ${showAnswer && !shuffle ? `<div class="answer-box"><div class="lbl">정답 · 진행 안내</div><p>${m.answer}</p></div>` : ""}
    ${shuffle ? "" : `<div class="actions">
      <button type="button" class="btn answer" id="toggle-answer">${showAnswer ? "정답 숨기기" : "정답 보기"}</button>
      ${m.time ? `<button type="button" class="btn timer" id="timer">${timer ? `남은 시간 ${timeLeft}초` : timeLeft === 0 && timer === false ? "시간 끝!" : `${m.time}초 타이머 시작`}</button>` : ""}
      <button type="button" class="btn pass" id="pass" title="이 미션은 세지 않고 다른 미션을 뽑아요">PASS · 다른 미션</button>
      <button type="button" class="btn giveup" id="giveup" title="횟수에 세지 않고 처음 화면으로 돌아가요">포기하기</button>
    </div>
    ${showAnswer ? `<div class="judge">
      <span class="judge-label">판정</span>
      <button type="button" class="btn ok" id="judge-ok">성공 · 보물 카드</button>
      <button type="button" class="btn fail" id="judge-fail">실패</button>
    </div>` : `<p class="judge-hint">‘정답 보기’를 누르면 성공 / 실패 판정 버튼이 나와요.</p>`}`}
  </article>`;
}

function resultHTML(c) {
  const w = winsOf(c), log = logOf(c), last = log[log.length - 1];
  if (w >= state.max) {
    return `<article class="card result done">
      <div class="stamp">미션 완료!</div>
      <h3>${c}반이 보물 카드 ${w}장을 모았어요</h3>
      <p class="desc">이제 보물 카드를 교환하러 가요.</p>
    </article>`;
  }
  if (last && last.r === "ok") {
    return `<article class="card result ok">
      <div class="stamp">성공!</div>
      <h3>보물 카드 1장을 주세요</h3>
      <p class="what">미션 ${pad(last.n)} ${byNum[last.n].title} · 보물 ${w} / ${state.max}</p>
      <p class="desc">준비되면 ‘다음 미션 뽑기’를 눌러요.</p>
    </article>`;
  }
  if (last && last.r === "fail") {
    return `<article class="card result fail">
      <div class="stamp">아쉬워요!</div>
      <h3>실패는 횟수에서 빠지지 않아요</h3>
      <p class="what">미션 ${pad(last.n)} ${byNum[last.n].title} · 보물 ${w} / ${state.max}</p>
      <p class="desc">‘다음 미션 뽑기’로 다시 도전해요.</p>
    </article>`;
  }
  return `<article class="card empty">
    <h3>${c}반, 준비됐나요?</h3>
    <p class="desc">‘미션 뽑기’를 누르면 미션 하나가 무작위로 나와요.<br>맞힌 미션만 세고, 성공 ${state.max}번이면 완료예요.</p>
  </article>`;
}

function renderStage() {
  const c = state.sel, w = winsOf(c), cur = curOf(c), log = logOf(c);
  $("who").innerHTML = `${c}반 <span>· 보물 ${w} / ${state.max}</span>`;
  $("rule").textContent = state.max;

  // 뽑기 버튼은 처음이거나 판정이 끝난 대기 상태에서만 보임
  const d = $("draw");
  d.hidden = animating || cur != null || w >= state.max;
  d.textContent = log.some(e => e.r !== "pass") ? "다음 미션 뽑기" : "미션 뽑기";

  const slot = $("card-slot");
  if (!animating) {
    if (cur != null) {
      const m = byNum[cur];
      slot.innerHTML = cardHTML(m);
      $("toggle-answer").onclick = () => { showAnswer = !showAnswer; renderStage(); };
      const tb = $("timer");
      if (tb) {
        if (timer) tb.classList.add("run");
        if (timer === false) tb.classList.add("end");
        tb.onclick = () => startTimer(m.time);
      }
      $("pass").onclick = passMission;
      $("giveup").onclick = () => judge("giveup");
      if (showAnswer) {
        $("judge-ok").onclick = () => judge("ok");
        $("judge-fail").onclick = () => judge("fail");
      }
    } else {
      slot.innerHTML = resultHTML(c);
    }
  }
  $("history").innerHTML = log.length
    ? `기록 ${log.map(e => `<span class="chip ${e.r}"><b>${RESULT[e.r]}</b><span>${pad(e.n)} ${byNum[e.n].title}</span></span>`).join("")}`
    : "";
}

function render() { renderBoard(); renderStage(); }

function stopTimer() { if (timer) clearInterval(timer); timer = null; timeLeft = 0; }
function startTimer(sec) {
  stopTimer();
  timeLeft = sec;
  timer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { clearInterval(timer); timer = false; }
    renderStage();
  }, 1000);
  renderStage();
}

const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function popCard() {
  const card = document.querySelector("#card-slot .card");
  if (card && !reduceMotion()) card.classList.add("pop");
}

// 뽑기 연출 후 apply(pick)로 기록을 바꿈. 뽑기와 PASS가 함께 씀
function spinTo(exclude, apply) {
  const p = pool(exclude);
  const pick = p[Math.floor(Math.random() * p.length)];
  showAnswer = false; stopTimer();
  const finish = () => {
    animating = false;
    apply(pick);
    save(); render(); popCard();
  };
  if (reduceMotion()) return finish();
  animating = true;
  renderBoard(); renderStage();
  let i = 0;
  const spin = setInterval(() => {
    const m = byNum[p[Math.floor(Math.random() * p.length)]];
    $("card-slot").innerHTML = cardHTML(m, true);
    if (++i >= 9) { clearInterval(spin); finish(); }
  }, 70);
}

$("draw").onclick = () => {
  const c = state.sel;
  if (curOf(c) != null || winsOf(c) >= state.max || animating) return;
  spinTo([], pick => { state.cur[c] = pick; });
};

// PASS: 지금 미션을 기록에 PASS로 남기고 새 미션으로 바꿈 (횟수에 세지 않음)
function passMission() {
  const c = state.sel, cur = curOf(c);
  if (cur == null || animating) return;
  spinTo([cur], pick => {
    state.log[c] = [...logOf(c), { n: cur, r: "pass" }];
    state.cur[c] = pick;
  });
}

function judge(r) {
  const c = state.sel, cur = curOf(c);
  if (cur == null || animating) return;
  state.log[c] = [...logOf(c), { n: cur, r }];
  state.cur[c] = null;
  showAnswer = false; stopTimer();
  save(); render(); popCard();
}

render();
</script>
</body>
