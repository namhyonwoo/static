<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 휴대폰: 확대·축소를 막고 노치 영역까지 화면을 쓴다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>거울전쟁 디펜스</title>
<style>
  /* 화면 전체를 캔버스 하나로 채운다. 스크롤·길게 누르기·글자 선택 같은 브라우저 기본 동작은 끈다 */
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    object-fit: contain;            /* 게임 화면 비율을 지킨 채 가장 크게 (남는 곳은 검은 여백) */
    image-rendering: pixelated;     /* 도트 그림을 뭉개지 않고 키운다 */
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    touch-action: none;             /* 터치를 스크롤·확대로 해석하지 않게 */
    display: block; background: #0b0d12;
  }
  /* 세로로 들고 있을 때 안내 (가로 전용 게임) */
  #rotate { display: none; position: fixed; inset: 0; background: #0b0d12; color: #dfe6f5; font: 600 18px/1.6 sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 5; }
  #rotate b { display: block; font-size: 44px; margin-bottom: 8px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="stage" width="800" height="450" aria-label="거울전쟁 디펜스 게임 화면"></canvas>
<div id="rotate"><div><b>↻</b>휴대폰을 가로로 돌려 주세요</div></div>

<!-- 원소스 멀티유즈: 전장 시뮬(../index.html)과 같은 데이터(sim/)와 엔진(mw/)을 그대로 쓴다.
     이 게임만의 코드는 맨 아래 mw/modes/defense.js 한 파일이다. -->
<script src="../sim/data.js"></script>
<script src="../mw/core/base.js"></script>
<script src="../mw/core/gamemap.js"></script>
<script src="../mw/core/unit.js"></script>
<script src="../mw/core/rules.js"></script>
<script src="../mw/render/assets.js"></script>
<script src="../mw/render/terrain.js"></script>
<script src="../mw/ui/hud.js"></script>
<script src="../mw/ui/sfx.js"></script>
<script src="../mw/modes/defense.js"></script>
<script>
  // 게임 시작. window.__defense 로 콘솔에서 상태를 들여다볼 수 있다 (예: __defense.mana = 200)
  window.__defense = new MWE.DefenseGame(document.getElementById('stage'), window.MW, { base: '../sim/' });
</script>
</body>
</html>
